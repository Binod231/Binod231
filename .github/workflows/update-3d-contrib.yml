name: Update 3D DevOps Visuals

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: Generate 3D & Gamified DevOps SVGs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install pillow

      - name: Generate Live Contribution & 3D Banner SVGs
        env:
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: python3 .github/scripts/generate_devops_visuals.py

      - name: Commit & Push Updated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git commit -m "chore: refresh live 3d and gamified devops svgs" || exit 0
          git push
