<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DEVOPS_DEFENDER.SH // Binod231 Terminal Arcade</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #04070e;
      color: #e2e8f0;
      font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }
    .terminal {
      width: 100%;
      max-width: 920px;
      background: #070d19;
      border: 1.5px solid #1e293b;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 40px rgba(16, 185, 129, 0.12);
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      background: #09111f;
      border-bottom: 1px solid #1e293b;
      font-size: 13px;
    }
    .dots { display: flex; gap: 7px; align-items: center; }
    .dot { width: 11px; height: 11px; border-radius: 50%; }
    .hud {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      padding: 10px 16px;
      background: #050912;
      border-bottom: 1px solid #1e293b;
      font-size: 13px;
    }
    .hud span b { color: #34d399; }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      background: #04070e;
      cursor: crosshair;
    }
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      padding: 12px 16px;
      background: #09111f;
      border-top: 1px solid #1e293b;
      font-size: 12px;
      color: #94a3b8;
    }
    button {
      background: #052e16;
      color: #34d399;
      border: 1px solid #10b981;
      padding: 6px 14px;
      border-radius: 6px;
      font-family: inherit;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #10b981; color: #04070e; }
  </style>
</head>
<body>
  <div class="terminal">
    <div class="topbar">
      <div class="dots">
        <span class="dot" style="background:#ef4444"></span>
        <span class="dot" style="background:#f59e0b"></span>
        <span class="dot" style="background:#10b981"></span>
        <span style="margin-left:8px;color:#34d399;font-weight:bold">root@binod-cloud:~# ./devops_defender.sh --arcade</span>
      </div>
      <a href="https://github.com/Binod231" style="color:#38bdf8;text-decoration:none">[ back to github ]</a>
    </div>
    <div class="hud">
      <span>SCORE: <b id="score">0</b> XP</span>
      <span>WAVE: <b id="wave">1</b></span>
      <span>CLUSTER_SLA: <b id="hp">100%</b></span>
      <span>HIGH_SCORE: <b id="hi">0</b></span>
    </div>
    <canvas id="game" width="900" height="460"></canvas>
    <div class="controls">
      <span>CONTROLS: [A / D] or [LEFT / RIGHT] to move | [SPACE] or [CLICK] to fire WAF laser</span>
      <div>
        <button id="restartBtn">./reboot_cluster.sh</button>
      </div>
    </div>
  </div>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const threats = ['CVE', '502', 'OOM', 'DDOS', 'LAG'];
    const colors = { CVE: '#ef4444', '502': '#f59e0b', OOM: '#ec4899', DDOS: '#f97316', LAG: '#a855f7' };

    let score = 0, wave = 1, hp = 100, over = false;
    let hi = Number(localStorage.getItem('binod_devops_hi') || 0);
    document.getElementById('hi').textContent = hi;

    const player = { x: 430, y: 410, w: 36, h: 24, speed: 6 };
    let bullets = [], enemies = [], particles = [], keys = {}, cooldown = 0;

    function spawnWave() {
      enemies = [];
      const rows = Math.min(4, 1 + Math.floor(wave / 2));
      const cols = 8;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const type = threats[(r + c + wave) % threats.length];
          enemies.push({
            x: 85 + c * 94,
            y: 48 + r * 46,
            w: 52,
            h: 28,
            dx: (1.1 + wave * 0.22),
            type
          });
        }
      }
    }

    function shoot() {
      if (over || cooldown > 0) return;
      bullets.push({ x: player.x + player.w / 2 - 2, y: player.y - 10, w: 4, h: 14 });
      cooldown = 12;
    }

    function resetGame() {
      score = 0; wave = 1; hp = 100; over = false;
      bullets = []; particles = []; player.x = 430;
      spawnWave();
      syncHud();
    }

    function syncHud() {
      document.getElementById('score').textContent = score;
      document.getElementById('wave').textContent = wave;
      document.getElementById('hp').textContent = hp + '%';
      if (score > hi) {
        hi = score;
        localStorage.setItem('binod_devops_hi', hi);
        document.getElementById('hi').textContent = hi;
      }
    }

    window.addEventListener('keydown', e => {
      keys[e.code] = true;
      if (e.code === 'Space') { e.preventDefault(); shoot(); }
      if (e.code === 'KeyR' && over) resetGame();
    });
    window.addEventListener('keyup', e => { keys[e.code] = false; });
    canvas.addEventListener('mousemove', e => {
      const rect = canvas.getBoundingClientRect();
      const mx = ((e.clientX - rect.left) / rect.width) * canvas.width;
      player.x = Math.max(10, Math.min(canvas.width - player.w - 10, mx - player.w / 2));
    });
    canvas.addEventListener('click', () => { over ? resetGame() : shoot(); });
    document.getElementById('restartBtn').addEventListener('click', resetGame);

    function loop() {
      ctx.fillStyle = '#04070e';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Subtle terminal grid
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 1;
      for (let x = 0; x < canvas.width; x += 36) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke(); }
      for (let y = 0; y < canvas.height; y += 36) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke(); }

      if (!over) {
        if (keys['ArrowLeft'] || keys['KeyA']) player.x = Math.max(10, player.x - player.speed);
        if (keys['ArrowRight'] || keys['KeyD']) player.x = Math.min(canvas.width - player.w - 10, player.x + player.speed);
        if (keys['Space']) shoot();
        if (cooldown > 0) cooldown--;

        bullets.forEach(b => b.y -= 9);
        bullets = bullets.filter(b => b.y > -20);

        let flip = false;
        enemies.forEach(en => {
          en.x += en.dx;
          if (en.x <= 12 || en.x + en.w >= canvas.width - 12) flip = true;
        });
        if (flip) {
          enemies.forEach(en => { en.dx *= -1; en.y += 18; });
        }

        // Collisions
        for (let i = bullets.length - 1; i >= 0; i--) {
          const b = bullets[i];
          for (let j = enemies.length - 1; j >= 0; j--) {
            const en = enemies[j];
            if (b.x < en.x + en.w && b.x + b.w > en.x && b.y < en.y + en.h && b.y + b.h > en.y) {
              bullets.splice(i, 1);
              enemies.splice(j, 1);
              score += 50;
              for (let p = 0; p < 8; p++) {
                particles.push({ x: en.x + en.w / 2, y: en.y + en.h / 2, vx: (Math.random() - 0.5) * 5, vy: (Math.random() - 0.5) * 5, life: 22, c: colors[en.type] });
              }
              syncHud();
              break;
            }
          }
        }

        enemies.forEach(en => {
          if (en.y + en.h >= player.y) {
            hp = Math.max(0, hp - 25);
            en.y = 48;
            syncHud();
            if (hp <= 0) over = true;
          }
        });

        if (enemies.length === 0) {
          wave++;
          hp = Math.min(100, hp + 10);
          spawnWave();
          syncHud();
        }
      }

      // Draw Player Ship
      ctx.fillStyle = '#38bdf8';
      ctx.beginPath();
      ctx.moveTo(player.x + player.w / 2, player.y);
      ctx.lineTo(player.x + player.w, player.y + player.h);
      ctx.lineTo(player.x, player.y + player.h);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#10b981';
      ctx.fillRect(player.x + 12, player.y + player.h, 12, 4);

      // Draw Bullets
      ctx.fillStyle = '#34d399';
      bullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));

      // Draw Threat Nodes
      ctx.font = 'bold 12px monospace';
      ctx.textAlign = 'center';
      enemies.forEach(en => {
        ctx.fillStyle = '#09111f';
        ctx.strokeStyle = colors[en.type];
        ctx.lineWidth = 1.6;
        ctx.fillRect(en.x, en.y, en.w, en.h);
        ctx.strokeRect(en.x, en.y, en.w, en.h);
        ctx.fillStyle = colors[en.type];
        ctx.fillText('[' + en.type + ']', en.x + en.w / 2, en.y + 18);
      });

      // Draw Particles
      particles.forEach(p => {
        p.x += p.vx; p.y += p.vy; p.life--;
        ctx.fillStyle = p.c;
        ctx.fillRect(p.x, p.y, 3, 3);
      });
      particles = particles.filter(p => p.life > 0);

      if (over) {
        ctx.fillStyle = 'rgba(4,7,14,0.82)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ef4444';
        ctx.font = 'bold 28px monospace';
        ctx.fillText('CLUSTER OUTAGE // GAME OVER', canvas.width / 2, 200);
        ctx.fillStyle = '#34d399';
        ctx.font = '16px monospace';
        ctx.fillText('FINAL SCORE: ' + score + ' XP  |  PRESS [R] OR CLICK TO REBOOT', canvas.width / 2, 240);
      }

      requestAnimationFrame(loop);
    }

    spawnWave();
    loop();
  </script>
</body>
</html>
