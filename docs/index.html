<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>binod@aws-cloud: ~ // Ubuntu DevOps Terminal & AWS Turbo GP</title>
  <style>
    :root {
      --ubu-bg: #300a24;
      --ubu-dark: #22071a;
      --ubu-bar: #3c3b37;
      --ubu-green: #8ae234;
      --ubu-blue: #729fcf;
      --ubu-orange: #e95420;
      --ubu-text: #eeeeec;
      --ubu-muted: #d3d7cf;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #140510;
      color: var(--ubu-text);
      font-family: 'Ubuntu Mono', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 18px 12px;
    }
    .ubuntu-window {
      width: 100%;
      max-width: 1060px;
      background: var(--ubu-bg);
      border: 1px solid #555753;
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.75);
    }
    .titlebar {
      background: linear-gradient(180deg, #484642 0%, #2c2b29 100%);
      padding: 8px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1e1d1b;
      user-select: none;
    }
    .title-left { display: flex; gap: 8px; align-items: center; }
    .tab-btn {
      background: #2c2b29;
      color: var(--ubu-muted);
      border: 1px solid #555753;
      padding: 4px 10px;
      border-radius: 5px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .tab-btn.active { background: var(--ubu-orange); color: #fff; border-color: var(--ubu-orange); }
    .title-center { font-family: system-ui, 'Ubuntu', sans-serif; font-size: 13px; font-weight: 600; color: var(--ubu-text); }
    .win-controls { display: flex; gap: 7px; align-items: center; }
    .win-dot {
      width: 16px; height: 16px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700; background: #3c3b37; color: var(--ubu-text);
      border: 1px solid #555753;
    }
    .win-dot.close { background: var(--ubu-orange); border-color: var(--ubu-orange); color: #fff; }
    .cmd-bar {
      background: #22071a;
      padding: 8px 14px;
      border-bottom: 1px solid #48183a;
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      align-items: center;
    }
    .cmd-chip {
      background: #3d1230;
      color: var(--ubu-green);
      border: 1px solid #5c244b;
      padding: 3px 9px;
      border-radius: 4px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .cmd-chip:hover { background: var(--ubu-green); color: #1a0514; }
    .cmd-chip.play { background: #5a200d; color: #ffad8e; border-color: var(--ubu-orange); }
    .cmd-chip.play:hover { background: var(--ubu-orange); color: #fff; }
    .terminal-body {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      max-height: 68vh;
      font-size: 14px;
      line-height: 1.55;
    }
    .entry { margin-bottom: 14px; }
    .prompt-line { margin-bottom: 4px; }
    .u-user { color: var(--ubu-green); font-weight: 700; }
    .u-path { color: var(--ubu-blue); font-weight: 700; }
    .stdout { color: var(--ubu-text); white-space: pre-wrap; padding-left: 4px; }
    .stdout a { color: #38bdf8; text-decoration: none; font-weight: 700; }
    .stdout a:hover { text-decoration: underline; }
    .graph-card {
      margin-top: 8px;
      background: #1d0515;
      border: 1px solid #5c244b;
      border-radius: 8px;
      padding: 12px;
    }
    .input-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 10px 16px;
      background: #22071a;
      border-top: 1px solid #48183a;
    }
    #cliInput {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--ubu-text);
      font-family: inherit;
      font-size: 14px;
    }
    /* Racing Game Pane */
    #racePane { display: none; flex-direction: column; background: #140510; }
    .race-hud {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      padding: 10px 16px;
      background: #22071a;
      border-bottom: 1px solid #48183a;
      font-size: 13px;
    }
    .race-hud b { color: var(--ubu-green); }
    canvas { display: block; width: 100%; height: auto; background: #0d0514; touch-action: none; }
    .race-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      padding: 10px 16px;
      background: #22071a;
      border-top: 1px solid #48183a;
      font-size: 12.5px;
      color: var(--ubu-muted);
    }
    .touch-btns { display: flex; gap: 8px; }
  </style>
</head>
<body>

    <div id="termPane" style="display:flex;flex-direction:column;flex:1;">
      <div id="termBody" class="terminal-body"></div>
      <div class="input-row">
        <span class="u-user">binod@aws-cloud</span>:<span class="u-path">~</span>$
        <input id="cliInput" type="text" placeholder="type a command (e.g. help, whoami, graph, play) and press Enter..." autofocus autocomplete="off" />
      </div>

    <!-- TTY2: AWS DEVOPS 3D HIGHWAY RACING GAME -->
    <div id="racePane">
      <div class="race-hud">
        <span>SPEED: <b id="rSpeed">120 km/h</b></span>
        <span>SCORE: <b id="rScore">0 XP</b></span>
        <span>SLA_FUEL: <b id="rFuel">100%</b></span>

        <span>HIGH_SCORE: <b id="rHi">0 XP</b></span>
      </div>
      <canvas id="raceCanvas" width="1020" height="450"></canvas>
      <div class="race-controls">
        <span>CONTROLS: [A / D] or [LEFT / RIGHT] steer | [W / UP] throttle | [SPACE] Nitro | Catch [ECS] [REDIS] [WAF] [LAMBDA], dodge [502] [OOM] [CVE]!</span>
        <div class="touch-btns">
          <button class="cmd-chip" id="btnLeft">&lt; LEFT</button>
          <button class="cmd-chip play" id="btnNitro">NITRO</button>
          <button class="cmd-chip" id="btnRight">RIGHT &gt;</button>
          <button class="cmd-chip" id="btnRaceReset">./restart.sh</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const termPane = document.getElementById('termPane');
    const racePane = document.getElementById('racePane');
    const tabTerm = document.getElementById('tabTerm');
    const tabRace = document.getElementById('tabRace');
    const termBody = document.getElementById('termBody');
    const cliInput = document.getElementById('cliInput');

    function switchTab(mode) {
      if (mode === 'race') {
        termPane.style.display = 'none';
        racePane.style.display = 'flex';
        tabRace.classList.add('active');
        tabTerm.classList.remove('active');
        raceActive = true;
      } else {
        racePane.style.display = 'none';
        termPane.style.display = 'flex';
        tabTerm.classList.add('active');
        tabRace.classList.remove('active');
        raceActive = false;
        cliInput.focus();
      }
    }
    tabTerm.onclick = () => switchTab('term');
    tabRace.onclick = () => switchTab('race');

    function esc(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function buildGraphHTML() {
      const weeks = 28;
      let cells = '';
      const cols = ['#3d1430', '#4e9a06', '#73d216', '#38bdf8', '#e95420'];
      for (let c = 0; c < weeks; c++) {
        for (let r = 0; r < 7; r++) {
          const lvl = ((c * 7 + r * 3 + (c % 5)) % 5);
          const x = 14 + c * 18;
          const y = 14 + r * 16;
          cells += `<rect x="${x}" y="${y}" width="13" height="12" rx="2" fill="${cols[lvl]}"/>`;
        }
      }
      return `<div class="graph-card">
        <div style="color:#8ae234;font-weight:bold;margin-bottom:8px">[GRAPH 1/2] GITHUB CONTRIBUTION HEATMAP (1,255+ COMMITS / 45 REPOS)</div>
        <svg viewBox="0 0 530 135" width="100%" style="max-width:620px;display:block;margin-bottom:12px;">${cells}</svg>
        <div style="color:#729fcf;font-weight:bold;margin-bottom:6px">[GRAPH 2/2] PRODUCTION ENGINEERING IMPACT TELEMETRY</div>
        <svg viewBox="0 0 600 105" width="100%" style="max-width:620px;display:block;">
          <text x="0" y="18" fill="#eeeeec" font-size="12" font-family="monospace">Uptime SLA       [99.9%]</text>
          <rect x="190" y="6" width="380" height="14" rx="3" fill="#22071a"/><rect x="190" y="6" width="376" height="14" rx="3" fill="#8ae234"/>
          <text x="0" y="46" fill="#eeeeec" font-size="12" font-family="monospace">OAuth2 Speedup   [+95%]</text>
          <rect x="190" y="34" width="380" height="14" rx="3" fill="#22071a"/><rect x="190" y="34" width="360" height="14" rx="3" fill="#38bdf8"/>
          <text x="0" y="74" fill="#eeeeec" font-size="12" font-family="monospace">CI/CD Build Cut  [~50%]</text>
          <rect x="190" y="62" width="380" height="14" rx="3" fill="#22071a"/><rect x="190" y="62" width="210" height="14" rx="3" fill="#f59e0b"/>
          <text x="0" y="100" fill="#eeeeec" font-size="12" font-family="monospace">AWS FinOps Saved [~30%]</text>
          <rect x="190" y="88" width="380" height="14" rx="3" fill="#22071a"/><rect x="190" y="88" width="145" height="14" rx="3" fill="#e95420"/>
        </svg>
      </div>`;
    }

    const COMMANDS = {
      help: () => `<span style="color:#8ae234;font-weight:bold">AVAILABLE UBUNTU TERMINAL COMMANDS:</span>
  <b>whoami</b>       -> Operator identity, AWS certifications, location & live metrics
  <b>experience</b>   -> Deep work history (Glovion, One Cloud Utopia, Karnovation, Sabudh)
  <b>projects</b>     -> Open-source DevOps, Security (SAST), SaaS & AI repos
  <b>stack</b>        -> Cloud, CI/CD, Observability, Backend & AI infrastructure matrix
  <b>certs</b>        -> Verified Credly AWS certs & community recognitions
  <b>blogs</b>        -> 7 AWS Builder Center technical articles
  <b>graph</b>        -> Render contribution heatmap & production telemetry graphs inline
  <b>play</b>         -> Launch AWS_TURBO_GP (3D AWS DevOps Highway Racing Game!)
  <b>clear</b>        -> Clear terminal output`,

      whoami: () => `<b>Binod Prasad Joshi</b> registered=4y+, uid=Binod231, role="Cloud & DevOps Consultant"
  guild         : Glovion Consulting Private Limited (Oct 2026 - Present)
  location      : Pokhara, Nepal (UTC+5:45 | Remote-friendly)
  certifications: AWS Solutions Architect (SAA-C03), AWS Cloud Practitioner (CLF-C02)
  recognitions  : AWS Community Builder (Dev Tools 2026), Google Student Ambassador (2026)
  portfolio     : <a href="https://binodprasadjoshi.com.np" target="_blank">https://binodprasadjoshi.com.np</a>
  github_stats  : 45 repositories | 1,255+ contributions <span style="color:#8ae234">######</span><span style="color:#38bdf8">####</span><span style="color:#e95420">##</span>`,

      experience: () => `<b>[1] Glovion Consulting Private Limited</b> — DevOps Consultant (Oct 2026 - Present)
    * End-to-end ERP (Odoo) production deployment, worker & PostgreSQL tuning (99.9% uptime)

    JWT auth with Redis token invalidation, Swagger docs & Docker`,

      certs: () => `[PASS] 2029-01  <a href="https://www.credly.com/badges/4fe1dc98-121e-41ed-a1b1-0d611ef6b6ac/public_url" target="_blank">AWS Certified Solutions Architect - Associate (SAA-C03)</a>
[PASS] 2028-10  <a href="https://www.credly.com/badges/f31fbcf5-1fdc-4f17-9f1b-41d7a1973d5c/linked_in_profile" target="_blank">AWS Certified Cloud Practitioner (CLF-C02)</a>
[PASS] 2026     AWS Community Builder - Dev Tools & Google Student Ambassador
[PASS] VERIFIED <a href="https://www.credly.com/badges/fab8bca5-d14d-4327-a2d6-8cff3e8e205a/public_url" target="_blank">AWS Cloud Quest: Cloud Practitioner & Serverless Developer</a>
[PASS] VERIFIED <a href="https://drive.google.com/file/d/1PLmbxr-GYJdqlXvptDIMHc2d7Xa9_DVz/view?usp=drive_link" target="_blank">NPTEL Elite + Silver (Cloud Computing & ML)</a> | <a href="https://leetcode.com/u/Binod124/" target="_blank">LeetCode SQL 50</a>`,

      blogs: () => `<b>AWS Builder Center Publications (@Binod231):</b>
  1. <a href="https://builder.aws.com/content/3JFung63VfYEKbYHIUuaJWred3l/the-agentic-ai-era-on-aws-whats-trending-in-2026-and-how-to-build-production-ready-agents" target="_blank">The Agentic AI Era on AWS: Bedrock AgentCore</a>
  2. <a href="https://builder.aws.com/content/3IwFRy6vy2DF9gviMgbX1J3uqrq/your-ai-agent-has-god-mode-iam-heres-the-proxy-i-built-to-take-it-away" target="_blank">Your AI Agent Has God-Mode IAM: Fail-Closed Proxy</a>
  3. <a href="https://builder.aws.com/content/3IGUEDK1H3yBfsV4W9XvVsCNZpA/the-digital-fast-pass-building-a-low-latency-global-application-on-aws" target="_blank">The Digital Fast-Pass: Global Low-Latency Apps on AWS</a>
  4. <a href="https://builder.aws.com/content/3Hth5GJ7ehZ6rJnmRaEiEWegoaO/i-gave-ai-its-own-aws-machine-then-destroyed-it" target="_blank">Ephemeral AI Sandboxes with Lambda MicroVMs & Firecracker</a>
  5. <a href="https://builder.aws.com/content/3HXH38b8XDsPBealUK4SfPygwLI/petabyte-ai-pipelines-apache-pig-meets-amazon-bedrock" target="_blank">Petabyte AI Pipelines: Apache Pig on EMR + Bedrock</a>
  6. <a href="https://builder.aws.com/content/3HJnLkHKc3wjIuL5kDYLi1mO58p/everyone-wanted-spark-we-kept-apache-pig-and-won-anyway" target="_blank">Cutting EMR Costs by 33% with Apache Pig & GitHub Actions OIDC</a>
  7. <a href="https://builder.aws.com/content/3HCa4ZqPprwVZM7mfDRBIdrjRNC/stop-reviewing-prs-let-aws-bedrock-do-it" target="_blank">Automated PR Reviews with Amazon Bedrock, CodeBuild & CDK</a>`,

      graph: () => buildGraphHTML(),
      graphs: () => buildGraphHTML(),
      play: () => { switchTab('race'); return 'Launching AWS_TURBO_GP in TTY2...'; }
    };

    function runCmd(raw) {
      const cmd = raw.trim().toLowerCase();
      if (!cmd) return;
      if (cmd === 'clear') { termBody.innerHTML = ''; return; }
      const entry = document.createElement('div');
      entry.className = 'entry';
      const prompt = `<div class="prompt-line"><span class="u-user">binod@aws-cloud</span>:<span class="u-path">~</span>$ ${esc(raw)}</div>`;
      const fn = COMMANDS[cmd];
      const out = fn ? fn() : `bash: ${esc(cmd)}: command not found. Type <b style="color:#8ae234">help</b> to list all commands.`;
      entry.innerHTML = prompt + `<div class="stdout">${out}</div>`;
      termBody.appendChild(entry);
      termBody.scrollTop = termBody.scrollHeight;
    }

    document.querySelectorAll('.cmd-chip[data-cmd]').forEach(btn => {
      btn.addEventListener('click', () => runCmd(btn.getAttribute('data-cmd')));
    });

    cliInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        const val = cliInput.value;
        cliInput.value = '';
        runCmd(val);
      }
    });

    // Boot initial Ubuntu terminal session
    runCmd('whoami');
    runCmd('help');

    // =========================================================
    // TTY2: AWS_TURBO_GP — 3D Perspective AWS DevOps Racing Game
    // =========================================================
    const rc = document.getElementById('raceCanvas');
    const rctx = rc.getContext('2d');
    const RW = rc.width, RH = rc.height, HORIZON = 135;

    let raceActive = false, rSpeed = 120, rScore = 0, rFuel = 100, rOver = false;
    let rHi = Number(localStorage.getItem('binod_racer_hi') || 0);
    let wafTimer = 0, redisTimer = 0, nitroTimer = 0, roadOffset = 0, curve = 0, curveTarget = 0;
    let playerLaneX = 0; // -1.2 to +1.2
    let rItems = [], rSparks = [], rKeys = {};

    const BOOSTS = [
      { kind: 'boost', tag: 'AWS ECS', col: '#8ae234', sub: '+SPEED' },
      { kind: 'boost', tag: 'REDIS',   col: '#38bdf8', sub: '2x TURBO' },
      { kind: 'boost', tag: 'AWS WAF', col: '#a855f7', sub: 'SHIELD' },
      { kind: 'boost', tag: 'LAMBDA',  col: '#f59e0b', sub: '+300 XP' },
      { kind: 'boost', tag: 'S3',      col: '#34d399', sub: '+15 FUEL' }
    ];
    const HAZARDS = [
      { kind: 'hazard', tag: '502 ERR', col: '#ef4444' },
      { kind: 'hazard', tag: 'OOM KILL', col: '#ec4899' },
      { kind: 'hazard', tag: 'CVE-0DAY', col: '#f97316' },
      { kind: 'hazard', tag: 'DDOS',     col: '#ef4444' }
    ];

    function resetRace() {
      rSpeed = 120; rScore = 0; rFuel = 100; rOver = false;
      wafTimer = 0; redisTimer = 0; nitroTimer = 0; playerLaneX = 0;
      rItems = []; rSparks = [];
      syncRaceHud();
    }

    function syncRaceHud() {
      document.getElementById('rSpeed').textContent = Math.round(rSpeed) + ' km/h';
      document.getElementById('rScore').textContent = Math.floor(rScore) + ' XP';
      document.getElementById('rFuel').textContent = Math.max(0, Math.round(rFuel)) + '%';
      let buff = 'NORMAL';
      if (wafTimer > 0) buff = 'WAF_SHIELD';
      else if (redisTimer > 0) buff = 'REDIS_2X_TURBO';
      else if (nitroTimer > 0) buff = 'ECS_NITRO';
      document.getElementById('rBuff').textContent = buff;
      if (rScore > rHi) { rHi = Math.floor(rScore); localStorage.setItem('binod_racer_hi', rHi); }
      document.getElementById('rHi').textContent = rHi + ' XP';
    }

    window.addEventListener('keydown', e => {
      if (!raceActive) return;
      rKeys[e.code] = true;
      if (e.code === 'Space') { e.preventDefault(); if (!rOver && rFuel > 8) { nitroTimer = 45; rFuel -= 3; } }
      if (e.code === 'KeyR' && rOver) resetRace();
    });
    window.addEventListener('keyup', e => { rKeys[e.code] = false; });

    document.getElementById('btnLeft').onmousedown = () => rKeys['ArrowLeft'] = true;
    document.getElementById('btnLeft').onmouseup = () => rKeys['ArrowLeft'] = false;
    document.getElementById('btnRight').onmousedown = () => rKeys['ArrowRight'] = true;
    document.getElementById('btnRight').onmouseup = () => rKeys['ArrowRight'] = false;
    document.getElementById('btnNitro').onclick = () => { if (!rOver && rFuel > 8) { nitroTimer = 50; rFuel -= 3; } };
    document.getElementById('btnRaceReset').onclick = resetRace;

    rc.addEventListener('mousemove', e => {
      if (!raceActive || rOver) return;
      const rect = rc.getBoundingClientRect();
      const nx = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      playerLaneX = Math.max(-1.05, Math.min(1.05, nx * 1.15));
    });
    rc.addEventListener('click', () => { if (rOver) resetRace(); });

    let spawnClock = 0;
    function spawnRoadItem() {
      const isBoost = Math.random() < 0.48;
      const tpl = isBoost
        ? BOOSTS[Math.floor(Math.random() * BOOSTS.length)]
        : HAZARDS[Math.floor(Math.random() * HAZARDS.length)];
      const lane = (Math.floor(Math.random() * 3) - 1) * 0.65; // -0.65, 0, +0.65
      rItems.push({ ...tpl, lane, z: 1.0 });
    }

    function raceLoop() {
      if (raceActive) {
        rctx.fillStyle = '#120410';
        rctx.fillRect(0, 0, RW, RH);

        // Synthwave Ubuntu twilight sky
        const sky = rctx.createLinearGradient(0, 0, 0, HORIZON);
        sky.addColorStop(0, '#1e0617');
        sky.addColorStop(1, '#3d102f');
        rctx.fillStyle = sky;
        rctx.fillRect(0, 0, RW, HORIZON);

        // Glowing AWS Horizon Sun
        rctx.fillStyle = '#e95420';
        rctx.beginPath(); rctx.arc(RW / 2 + curve * 90, HORIZON - 10, 44, Math.PI, 0); rctx.fill();

        if (!rOver) {
          if (rKeys['ArrowLeft'] || rKeys['KeyA']) playerLaneX -= 0.048;
          if (rKeys['ArrowRight'] || rKeys['KeyD']) playerLaneX += 0.048;
          playerLaneX = Math.max(-1.05, Math.min(1.05, playerLaneX));

          let targetSpd = (rKeys['ArrowUp'] || rKeys['KeyW']) ? 220 : 145;
          if (nitroTimer > 0) { targetSpd = 295; nitroTimer--; }
          if (redisTimer > 0) { targetSpd = Math.max(targetSpd, 250); redisTimer--; }
          if (wafTimer > 0) wafTimer--;

          rSpeed += (targetSpd - rSpeed) * 0.08;
          const dz = rSpeed * 0.00011;
          roadOffset = (roadOffset + rSpeed * 0.04) % 1;

          if (Math.random() < 0.015) curveTarget = (Math.random() - 0.5) * 0.8;
          curve += (curveTarget - curve) * 0.015;

          rScore += (rSpeed * 0.05) * (redisTimer > 0 ? 2 : 1);
          rFuel = Math.max(0, rFuel - 0.016);
          if (rFuel <= 0) rOver = true;

          spawnClock++;
          if (spawnClock > Math.max(16, 36 - Math.floor(rSpeed / 16))) {
            spawnRoadItem();
            spawnClock = 0;
          }

          for (let i = rItems.length - 1; i >= 0; i--) {
            const it = rItems[i];
            it.z -= dz;
            if (it.z <= 0.14 && it.z >= 0.03 && Math.abs(it.lane - playerLaneX) < 0.34) {
              rItems.splice(i, 1);
              if (it.kind === 'boost') {
                if (it.tag === 'AWS ECS') nitroTimer = 95;
                else if (it.tag === 'REDIS') redisTimer = 180;
                else if (it.tag === 'AWS WAF') wafTimer = 220;
                else if (it.tag === 'LAMBDA') rScore += 300;
                else if (it.tag === 'S3') rFuel = Math.min(100, rFuel + 18);
                rScore += 100;
                for (let k = 0; k < 10; k++) rSparks.push({ x: RW/2 + playerLaneX*190, y: RH-68, vx:(Math.random()-0.5)*6, vy:(Math.random()-0.5)*6, c: it.col, life: 20 });
              } else {
                if (wafTimer > 0) {
                  rScore += 250;
                  for (let k = 0; k < 12; k++) rSparks.push({ x: RW/2 + playerLaneX*190, y: RH-68, vx:(Math.random()-0.5)*8, vy:(Math.random()-0.5)*8, c: '#38bdf8', life: 22 });
                } else {
                  rFuel = Math.max(0, rFuel - 20);
                  rSpeed = 75;
                  for (let k = 0; k < 12; k++) rSparks.push({ x: RW/2 + playerLaneX*190, y: RH-68, vx:(Math.random()-0.5)*8, vy:(Math.random()-0.5)*8, c: '#ef4444', life: 22 });
                  if (rFuel <= 0) rOver = true;
                }
              }
            } else if (it.z < 0) {
              rItems.splice(i, 1);
            }
          }
          syncRaceHud();
        }

        // Render Pseudo-3D Road Strips
        const strips = 42;
        for (let s = strips; s >= 1; s--) {
          const z1 = s / strips;
          const z2 = (s - 1) / strips;
          const y1 = HORIZON + (1 - z1) * (RH - HORIZON);
          const y2 = HORIZON + (1 - z2) * (RH - HORIZON);
          const w1 = 42 + (1 - z1) * 410;
          const w2 = 42 + (1 - z2) * 410;
          const cx1 = RW / 2 + curve * Math.pow(z1, 1.8) * 140;
          const cx2 = RW / 2 + curve * Math.pow(z2, 1.8) * 140;

          const stripe = Math.floor((z1 * 12 + roadOffset * 4)) % 2 === 0;
          // Terrain
          rctx.fillStyle = stripe ? '#1a0615' : '#140410';
          rctx.fillRect(0, y1, RW, (y2 - y1) + 1);

          // Road asphalt
          rctx.fillStyle = stripe ? '#182132' : '#131a29';
          rctx.beginPath();
          rctx.moveTo(cx1 - w1, y1); rctx.lineTo(cx1 + w1, y1);
          rctx.lineTo(cx2 + w2, y2); rctx.lineTo(cx2 - w2, y2);
          rctx.closePath(); rctx.fill();

          // Neon Shoulder Curbs
          rctx.fillStyle = stripe ? '#8ae234' : '#e95420';
          rctx.fillRect(cx1 - w1 - 8*(1-z1), y1, 8*(1-z1)+2, (y2-y1)+1);
          rctx.fillRect(cx1 + w1, y1, 8*(1-z1)+2, (y2-y1)+1);

          // 3-Lane Dashed Dividers
          if (stripe) {
            rctx.fillStyle = '#38bdf8';
            rctx.fillRect(cx1 - w1 * 0.33, y1, Math.max(1.5, 4 * (1 - z1)), (y2 - y1) * 0.75);
            rctx.fillRect(cx1 + w1 * 0.33, y1, Math.max(1.5, 4 * (1 - z1)), (y2 - y1) * 0.75);
          }
        }

        // Render Road Items sorted far-to-near
        rItems.sort((a, b) => b.z - a.z);
        rItems.forEach(it => {
          const pScale = Math.max(0.15, 1 - it.z);
          const ry = HORIZON + pScale * (RH - HORIZON);
          const rw = 42 + pScale * 410;
          const rcx = RW / 2 + curve * Math.pow(it.z, 1.8) * 140;
          const ix = rcx + it.lane * rw * 0.8;
          const bw = 66 * pScale + 14;
          const bh = 28 * pScale + 8;

          rctx.fillStyle = it.kind === 'boost' ? '#052e16' : '#450a0a';
          rctx.strokeStyle = it.col;
          rctx.lineWidth = 2;
          rctx.fillRect(ix - bw / 2, ry - bh, bw, bh);
          rctx.strokeRect(ix - bw / 2, ry - bh, bw, bh);
          rctx.fillStyle = it.col;
          rctx.font = `bold ${Math.max(8, Math.floor(12 * pScale + 3))}px monospace`;
          rctx.textAlign = 'center';
          rctx.fillText(it.tag, ix, ry - bh / 2 + 4);
        });

        // Render Cyber Sports Car
        const carX = RW / 2 + playerLaneX * 260;
        const carY = RH - 56;
        rctx.save();
        rctx.translate(carX, carY);
        if (wafTimer > 0) {
          rctx.strokeStyle = '#a855f7';
          rctx.lineWidth = 2.5;
          rctx.beginPath(); rctx.ellipse(0, 12, 60, 32, 0, 0, Math.PI * 2); rctx.stroke();
        }
        // Car chassis
        rctx.fillStyle = '#0284c7';
        rctx.strokeStyle = '#38bdf8';
        rctx.lineWidth = 2;
        rctx.beginPath();
        rctx.moveTo(-26, -10); rctx.lineTo(26, -10);
        rctx.lineTo(44, 24); rctx.lineTo(-44, 24);
        rctx.closePath(); rctx.fill(); rctx.stroke();
        // Windshield
        rctx.fillStyle = '#e0f2fe';
        rctx.beginPath();
        rctx.moveTo(-18, -6); rctx.lineTo(18, -6); rctx.lineTo(26, 6); rctx.lineTo(-26, 6);
        rctx.closePath(); rctx.fill();
        // Tail lights & Nitro flames
        rctx.fillStyle = '#e95420';
        rctx.fillRect(-34, 16, 16, 6);
        rctx.fillRect(18, 16, 16, 6);
        if (nitroTimer > 0 || redisTimer > 0) {
          rctx.fillStyle = '#8ae234';
          rctx.fillRect(-26, 24, 10, 12 + Math.random() * 10);
          rctx.fillRect(16, 24, 10, 12 + Math.random() * 10);
        }
        rctx.fillStyle = '#eeeeec';
        rctx.font = 'bold 10px monospace';
        rctx.textAlign = 'center';
        rctx.fillText('BINOD-AWS', 0, 18);
        rctx.restore();

        // Sparks
        for (let i = rSparks.length - 1; i >= 0; i--) {
          const sp = rSparks[i];
          sp.x += sp.vx; sp.y += sp.vy; sp.life--;
          rctx.fillStyle = sp.c;
          rctx.fillRect(sp.x, sp.y, 4, 4);
          if (sp.life <= 0) rSparks.splice(i, 1);
        }

        if (rOver) {
          rctx.fillStyle = 'rgba(20, 5, 16, 0.82)';
          rctx.fillRect(0, 0, RW, RH);
          rctx.textAlign = 'center';
          rctx.fillStyle = '#ef4444';
          rctx.font = 'bold 28px monospace';
          rctx.fillText('SLA FUEL DEPLETED // PIT STOP REQUIRED', RW / 2, RH / 2 - 16);
          rctx.fillStyle = '#8ae234';
          rctx.font = '16px monospace';
          rctx.fillText('SCORE: ' + Math.floor(rScore) + ' XP  |  CLICK OR PRESS [R] TO RACE AGAIN', RW / 2, RH / 2 + 22);
        }
      }
      requestAnimationFrame(raceLoop);
    }
    raceLoop();
  </script>
</body>
</html>
